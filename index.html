<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinitcell</title>
    <link rel="stylesheet" href="css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
<body>
    <header id="banner">
        <!-- banner -->
    </header>
    <main>
        <section id="products">
            <h1>Nossos Aparelhos</h1>
            <p id="subtitle">Escolha o seu aparelho ideal!</p>
            <div id="products-container">
                <div class="product-card">
                    <figure>
                        <img src="https://http2.mlstatic.com/D_NQ_NP_739019-MLA95656293708_102025-O.webp" alt="iPhone 17 Pro Max">
                    </figure>
                        <div class="info">
                        <h2 class="name">iPhone 17 Pro Max 256GB</h2>
                        <p class="price">R$ 11.249,10</p>
                        <div class="buttons">
                            <button class="btn" type="button">Saiba mais</button>
                            <a class="btn" href="https://wa.me/98992036351" rel="nofollow" target="_blank"><i class='bx bxl-whatsapp'></i> WhatsApp</a>
                        </div>
                    </div>
                </div> <!-- Card 1 -->
                <div class="product-card">
                    <figure><img src="https://http2.mlstatic.com/D_NQ_NP_739019-MLA95656293708_102025-O.webp" alt="iPhone 17 Pro Max"></figure>
                    <div class="info"> 
                        <h2 class="name">iPhone 17 Pro Max 256GB</h2>
                        <p class="price">R$ 11.249,10</p>
                        <div class="buttons">
                            <button class="btn" type="button">Saiba mais</button>
                            <a class="btn" href="https://wa.me/98992036351" rel="nofollow" target="_blank"><i class='bx bxl-whatsapp'></i> WhatsApp</a>
                        </div>
                    </div>
                </div> <!-- Card 2 -->
            </div>
        </section>
    </main>
        <footer>
            <div id="container-credits">
                <div class="credit">
                    <img src="img/logo.png" alt="Logo Infinitcell">
                    <p>Conectando você com a mehor tecnologia do mercado!</p>
                </div>
                    <div class="social-media">
                        <a href="https://www.facebook.com/infinitcell" target="_blank"><i class='bx bxl-facebook-circle'></i></a>
                        <a href="https://www.instagram.com/infinitcell" target="_blank"><i class='bx bxl-instagram-alt'></i></a>
                    </div>
            </div>
            <div id="copyright">
                <p>&copy; 2026 Infinitcell. Todos os direitos reservados.</p>
                <p>Desenvolvido por Elson Santos</p>
            </div>
        </footer>
</body>
</html>
